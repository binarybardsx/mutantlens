[project]
name = "mutantlens"
version = "0.0.1"
description = "Measures whether a test suite actually catches bugs, by seeding small faults and counting how many the tests notice."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "libcst>=1.9.0",
    "pydantic>=2.14.1",
]

[project.scripts]
mutantlens = "mutantlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutantlens"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[tool.ruff]
extend-exclude = ["spike", "toy", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["mutantlens", "tests"]
exclude = ["spike", "toy", "tests/fixtures"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
